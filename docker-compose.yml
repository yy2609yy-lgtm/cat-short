services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catshort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catshort}
      POSTGRES_DB: ${POSTGRES_DB:-catshort}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catshort} -d ${POSTGRES_DB:-catshort}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catshort:catshort@postgres:5432/catshort}
    volumes:
      - workdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catshort:catshort@postgres:5432/catshort}
    volumes:
      - workdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  scheduler:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catshort:catshort@postgres:5432/catshort}
    volumes:
      - workdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  workdata:
